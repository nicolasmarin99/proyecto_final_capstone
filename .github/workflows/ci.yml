name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  api:
    name: API — tipos y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localcl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/localcl
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace=@localcl/api

      - name: Aplicar migraciones
        run: npm run migrate:deploy --workspace=@localcl/api

      - name: Verificar tipos
        run: npm run typecheck --workspace=@localcl/api

      - name: Ejecutar pruebas
        run: npm run test --workspace=@localcl/api
