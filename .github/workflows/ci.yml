name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  shared:
    name: Shared — tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck --workspace=@localcl/shared

      - name: Ejecutar pruebas
        run: npm run test --workspace=@localcl/shared

      - name: Compilar
        run: npm run build --workspace=@localcl/shared

  api:
    name: API — tipos y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: localcl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Estas variables cumplen acá el papel que en local cumple apps/api/.env.test,
    # que no se versiona. Lo que se agregue allá y las pruebas necesiten, hay que
    # agregarlo también aquí: apps/api/.env.test.example es la referencia de qué
    # espera env.ts.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/localcl
      CORS_ORIGIN: http://localhost:5173
      # Valor de usar y tirar: el contenedor y los tokens mueren con el job.
      # Un secreto real iría en los Secrets del repositorio, nunca aquí.
      JWT_SECRET: secreto-de-integracion-continua-no-usar-en-produccion

      # Sin esto env.ts toma el valor por defecto "smtp", el guardarraíl de
      # tests/bandeja.ts corta la ejecución y el job falla. No se levanta
      # Mailpit en CI a propósito: el transporte en memoria hace que las
      # pruebas no dependan de ningún servicio externo.
      CORREO_TRANSPORTE: memoria

      # El valor por defecto es "true", así que sin esta línea cada registro
      # de las pruebas saldría a consultar Have I Been Pwned desde el runner.
      # No rompería el job, porque el módulo deja pasar cuando el servicio
      # falla, pero ataría el CI a la disponibilidad de un tercero y a su
      # latencia. El comportamiento de esa consulta se prueba aparte, con
      # fetch simulado, en auth.filtradas.test.ts.
      REVISAR_CONTRASENAS_FILTRADAS: "false"

      # Base de los enlaces que arman las plantillas de correo. Hoy el valor
      # por defecto coincide, pero fijarlo evita que un cambio de ese default
      # altere en silencio lo que las pruebas ven en los correos.
      URL_WEB: http://localhost:5173

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # apps/api importa @localcl/shared desde su dist. El script prepare del
      # paquete ya lo compila durante npm ci, pero se deja explícito para que
      # este job no dependa de un efecto secundario de la instalación.
      - name: Compilar paquete compartido
        run: npm run build --workspace=@localcl/shared

      - name: Generar cliente de Prisma
        run: npm run prisma:generate --workspace=@localcl/api

      - name: Aplicar migraciones
        run: npm run migrate:deploy --workspace=@localcl/api

      - name: Verificar tipos
        run: npm run typecheck --workspace=@localcl/api

      - name: Ejecutar pruebas
        run: npm run test --workspace=@localcl/api

  web:
    name: Web — tipos, pruebas y build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Misma razón que en el job de la API: la web importa @localcl/shared
      # desde su dist, así que se compila antes de nada.
      - name: Compilar paquete compartido
        run: npm run build --workspace=@localcl/shared

      - name: Verificar tipos
        run: npm run typecheck --workspace=@localcl/web

      - name: Ejecutar pruebas
        run: npm run test --workspace=@localcl/web

      - name: Compilar
        run: npm run build --workspace=@localcl/web
